name: medultra
description: MedUltra - referencia de ultrassonografia (fetal, pediatrica e adulto).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/app/
    - assets/data/
    - assets/strings/
    - assets/content/
    - assets/content/_app/
    - assets/images/
    - assets/icons/
